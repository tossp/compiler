name: 拉取并重标记镜像

# Controls when the action will run. 
on:
  # 任意推送都会触发构建
  push:
    paths:
      - '/.github/workflows/mirror.yml'
  # 定时调度
  # schedule:
  #   - cron: "30 5 * * 5"

  # Allows you to run this workflow manually from the Actions tab
# 可以手动触发
  workflow_dispatch:
    inputs:
      logLevel:
        description: '日志级别（预留）'
        required: true
        default: 'warning'
      tags:
        description: '测试标签（预留）'

jobs:
  buildx:
    runs-on: ubuntu-latest
    name: 拉取并重标记 "${{matrix.user}}/${{matrix.name}}:${{matrix.version}}"
    strategy:
      fail-fast: false
      matrix:
       include:
         - user: dreamacro
           name: clash-premium           
           version: latest
    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v7
      - name: 记录当前日期
        id: date
        run: echo "::set-output name=today::$(date +'%Y%m%d')"
      - name: 配置 QEMU 跨架构模拟
        uses: docker/setup-qemu-action@v4
      - name: 配置 Buildx 构建器
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: 显示支持的构建平台
        run: echo ${{ steps.buildx.outputs.platforms }}
      # - name: 登录天坑容器
      #   uses: docker/login-action@v1
      #   with:
      #     registry: tsds.tossp.com:2087
      #     username: ${{ secrets.TOSSP_USERNAME }}
      #     password: ${{ secrets.TOSSP_PASSWORD }}
      - name: 拉取镜像并添加目标仓库标签
        run: |
          docker pull ${{matrix.user}}/${{matrix.name}}:${{matrix.version}}
          docker tag ${{matrix.user}}/${{matrix.name}}:${{matrix.version}} registry.tossp.com/ts/compiler/${{matrix.name}}:${{matrix.version}}
          # docker push tsds.tossp.com:2087/mirror/${{matrix.name}}:${{matrix.version}}
      - name: 清理历史运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3
