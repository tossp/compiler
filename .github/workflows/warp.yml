name: 验证 Warp Windows 构建

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/warp.yml'
      - 'app/warp/**'

jobs:
  windows-oss-smoke:
    name: 构建 Warp 开源 Windows 版
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v7

      - name: 检出 Warp 源码
        uses: actions/checkout@v7
        with:
          repository: warpdotdev/warp
          path: warp-src

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt,clippy

      - name: 启用 Git 长路径支持
        shell: bash
        run: git config --system core.longpaths true

      - name: 缓存 Rust 构建依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: warp-src

      - name: 安装 cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.18.1
        env:
          BINSTALL_VERSION: 1.14.4

      - name: 安装 Warp 编译依赖
        shell: pwsh
        working-directory: warp-src
        run: ./script/windows/install_build_deps.ps1

      - name: 配置 Node.js 构建环境
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: 安装并启用 Corepack
        shell: bash
        run: |
          npm install --global corepack
          corepack enable

      - name: 通过 Chocolatey 安装 protoc
        id: install_protoc
        continue-on-error: true
        uses: ConorMacBride/install-package@v1
        with:
          choco: protoc

      - name: 通过 winget 补装 protoc
        if: steps.install_protoc.outcome == 'failure'
        shell: pwsh
        run: winget install Google.Protobuf

      - name: 校验 Cargo.lock 与依赖声明一致
        shell: bash
        working-directory: warp-src
        run: cargo metadata --locked --format-version=1 > NUL

      - name: 编译 Warp 开源 Windows 版
        id: build_binary
        shell: bash
        working-directory: warp-src
        run: script/bundle -Channel oss -skip_build_installer --arch x64

      - name: 上传 Warp Windows 可执行文件
        uses: actions/upload-artifact@v7
        with:
          name: warp-windows-oss-x64
          path: ${{ steps.build_binary.outputs.binary_path }}
