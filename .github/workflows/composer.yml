name: 构建 hs-derp 镜像
on:
  # 任意推送都会触发构建
  push:
    paths:
      - '.github/workflows/composer.yml'
  schedule:
    - cron: "30 5 * * 5"

  workflow_dispatch:
    inputs:
      logLevel:
        description: "日志级别（预留）"
        required: true
        default: "warning"
      tags:
        description: "测试标签（预留）"

jobs:
  buildx:
    name: 构建并发布多架构镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v7
      - name: 生成镜像日期标签
        id: prepare
        run: echo "today=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      - name: 配置 QEMU 跨架构模拟
        uses: docker/setup-qemu-action@v4
      - name: 配置 Buildx 构建器
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: 显示支持的构建平台
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: 登录 GHCR 镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送 hs-derp 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./compose/hs-derp
          file: ./compose/hs-derp/dockerfile
          platforms: linux/amd64,linux/amd64/v2,linux/amd64/v3,linux/arm64,linux/arm/v7,linux/arm/v6
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            tossp/hs-derp:latest
            tossp/hs-derp:${{ steps.prepare.outputs.today }}
      - name: 清理历史运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3
